name: SUDHA Debug APK and Auto Update

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set development version
        run: |
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Decode permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sudha-release.jks"

      - name: Build signed debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sudha-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME" assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p release
          echo "0.1.$GITHUB_RUN_NUMBER" > release/version.txt
          cp app/build/outputs/apk/debug/app-debug.apk release/SUDHA-debug.apk
          cd release
          sha256sum SUDHA-debug.apk > SUDHA-debug.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUDHA-debug-apk
          path: release/*
          retention-days: 14

      - name: Move debug-latest tag to this commit
        if: github.event_name != 'pull_request'
        run: |
          git tag -f debug-latest "$GITHUB_SHA"
          git push origin refs/tags/debug-latest --force

      - name: Publish or update Debug channel release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: SUDHA Debug Latest
          prerelease: true
          make_latest: false
          files: |
            release/SUDHA-debug.apk
            release/SUDHA-debug.apk.sha256
            release/version.txt
